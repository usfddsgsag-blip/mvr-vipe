name: Build macOS

on:
  push:
    branches:
      - codex/macos
    tags:
      - "macos-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      PYINSTALLER_TARGET_ARCH: ${{ matrix.arch }}
      ASSET_NAME: MVR_PSP_Check-macOS-${{ matrix.arch }}.zip
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build-macos.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build-macos.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("certificate.p12").write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE"])
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          identity="$(
            security find-identity -v -p codesigning build.keychain |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
            head -n 1
          )"
          test -n "$identity"
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: pyinstaller --noconfirm --clean MVR_PSP_Check.macOS.spec

      - name: Verify app bundle
        shell: bash
        run: |
          test -x "dist/MVR PSP Check.app/Contents/MacOS/MVR_PSP_Check"
          test -f "dist/MVR PSP Check.app/Contents/Resources/ui/web/index.html"
          test -f "dist/MVR PSP Check.app/Contents/Resources/updater/macos_update.sh"
          codesign --verify --deep --strict --verbose=2 "dist/MVR PSP Check.app"

      - name: Notarize app bundle
        if: ${{ env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        shell: bash
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/MVR PSP Check.app" \
            "dist/notarization.zip"
          xcrun notarytool submit "dist/notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/MVR PSP Check.app"
          rm "dist/notarization.zip"

      - name: Package release asset
        shell: bash
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/MVR PSP Check.app" \
            "dist/$ASSET_NAME"
          cd dist
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish macOS release
    if: ${{ startsWith(github.ref, 'refs/tags/macos-v') }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: MVR / PSP Check macOS ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
